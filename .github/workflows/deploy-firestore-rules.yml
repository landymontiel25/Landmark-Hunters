name: Deploy Firestore Rules

# Runs only when firestore.rules, storage.rules or firestore.indexes.json changes on main, so merging a PR
# that touches it is the whole deploy step -- no separate manual
# `firebase deploy --only firestore:rules` needed afterward. Needs a
# FIREBASE_SERVICE_ACCOUNT repo secret to actually do anything (see below);
# without it this job just fails loudly in the Actions tab rather than
# silently no-op'ing, so a missing/expired secret is easy to notice.
#
# To set up the secret once:
#   1. Firebase console -> Project Settings -> Service Accounts -> Generate
#      new private key (downloads a JSON file).
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New
#      repository secret, name it FIREBASE_SERVICE_ACCOUNT, paste the
#      entire JSON file's contents as the value.
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
  # Lets you re-deploy on demand from the Actions tab (Run workflow) without
  # needing a new firestore.rules change to push -- e.g. right after adding
  # the FIREBASE_SERVICE_ACCOUNT secret for the first time, to deploy
  # whatever's already on main instead of waiting for the next rules edit.
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Never deploy rules that fail their own emulator tests.
      - run: npm ci
      - run: npm run test:rules
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set -- see the comment at the top of this workflow file for setup steps."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@13 deploy --only firestore:rules --non-interactive
      # Separate step so a Storage permission problem can never hold back the
      # Firestore rules above. Needs the service account to have the
      # "Service Usage Consumer" and "Firebase Rules Admin" roles in Google
      # Cloud IAM; without them this step fails (red) after Firestore deploys.
      - name: Deploy Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@13 deploy --only storage --non-interactive
      # Composite indexes (firestore.indexes.json), last so an index problem
      # (the service account may need the Cloud Datastore Index Admin role)
      # never holds back either set of rules. Never deletes an index that
      # exists only in the console (no --force).
      - name: Deploy Firestore indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@13 deploy --only firestore:indexes --non-interactive
